<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Day 8 - Form</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="form-page">

        <section class="form-intro">
            <p class="eyebrow">OPERATION BUILD - DAY 08</p>

            <h1>Let's build something.</h1>

            <p>
                Tell me a little about your project and what you're trying to create.
            </p>
        </section>

        <form class="project-form">

            <div class="form-group">
                <label for="name">Your name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="project-type">What are you building?</label>

                <select id="project-type" name="project-type" required>
                    <option value="">Select one</option>
                    <option value="website">Website</option>
                    <option value="web-app">Web application</option>
                    <option value="portfolio">Portfolio</option>
                    <option value="other">Something else</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Tell me about it</label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                ></textarea>
            </div>

            <button type="submit">Send project →</button>

        </form>

    </main>

</body>
</html>
